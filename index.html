<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        :root {
            --active-green: #5eb471;
            --inactive-grey: #a0a0a0;
            --bg-white: #ffffff;
            --border-grey: #f0f0f0;
            --text-black: #343a40;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .phone-screen {
            background-color: var(--bg-white);
            width: 380px;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 5px solid #ffcc33; /* الشريط الأصفر العلوي */
        }

        /* Header Area */
        .app-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-grey);
        }

        .app-bar h1 {
            font-size: 18px;
            margin: 0;
            color: var(--text-black);
            font-weight: 700;
        }

        .icon { color: var(--text-black); font-size: 20px; cursor: pointer; }

        /* Stepper Section */
        .stepper-container {
            padding: 30px 40px;
            position: relative;
        }

        .step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
            position: relative;
        }

        /* الخط الواصل بين النقاط */
        .step::before {
            content: '';
            position: absolute;
            right: -21px;
            top: 15px;
            width: 2px;
            height: 100%;
            background-color: #d1d1d1;
            z-index: 1;
        }

        .step:last-child::before { display: none; }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #d1d1d1; /* اللون الافتراضي */
            position: absolute;
            right: -26px;
            top: 6px;
            z-index: 2;
        }

        /* حالة "إنشاء الطلب" فقط خضراء */
        .step.active .dot { background-color: var(--active-green); }
        .step.active .step-title { color: var(--active-green); }

        .step-content { display: flex; flex-direction: column; }

        .step-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--inactive-grey);
            margin-bottom: 2px;
        }

        .step-date {
            font-size: 11px;
            color: #888;
        }

        /* Barcode Section */
        .barcode-area {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-grey);
        }

        .barcode-img {
            width: 75%;
            filter: grayscale(1);
            margin-bottom: 10px;
        }

        .order-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-black);
        }

        /* Footer Details */
        .info-row {
            border-top: 1px solid var(--border-grey);
            padding: 15px 25px;
        }

        .label {
            font-size: 11px;
            color: #b0b0b0;
            margin-bottom: 4px;
            display: block;
        }

        .value {
            font-size: 14px;
            color: var(--text-black);
            font-weight: 700;
        }

        .email { font-family: sans-serif; letter-spacing: 0.5px; }

    </style>
</head>
<body>

<div class="phone-screen">
    <div class="app-bar">
        <div class="icon">⋮</div>
        <h1>شحنة رقم # 51972521</h1>
        <div class="icon">〉</div>
    </div>

    <div class="stepper-container">
        <div class="step active">
            <div class="dot"></div>
            <div class="step-content">
                <span class="step-title">إنشاء الطلب</span>
                <span class="step-date">تم إنشاء الطلب : الأحد، 19-أكتوبر-2025</span>
            </div>
        </div>

        <div class="step">
            <div class="dot"></div>
            <div class="step-content">
                <span class="step-title">جاري المعالجة</span>
            </div>
        </div>

        <div class="step">
            <div class="dot"></div>
            <div class="step-content">
                <span class="step-title">تحت التجهيز</span>
            </div>
        </div>

        <div class="step">
            <div class="dot"></div>
            <div class="step-content">
                <span class="step-title">تم الشحن</span>
            </div>
        </div>

        <div class="step">
            <div class="dot"></div>
            <div class="step-content">
                <span class="step-title">تم التوصيل</span>
            </div>
        </div>
    </div>

    <div class="barcode-area">
        <img src="https://bwipjs-api.metafloor.com/?bcid=code128&text=2007992813&scale=4&includetext=false" class="barcode-img">
        <div class="order-number">رقم الطلب: 2007992813</div>
    </div>

    <div class="info-row">
        <span class="label">تاريخ إنشاء الطلب</span>
        <span class="value">الأحد، 19-أكتوبر-2025</span>
    </div>

    <div class="info-row">
        <span class="label">الشحن إلى:</span>
        <span class="value email">campus6med@gmail.com</span>
    </div>

    <div class="info-row">
        <span class="label">طريقة الشحن</span>
        <span class="value">@ تسليم البريد الإلكتروني</span>
    </div>
</div>

</body>
</html>
